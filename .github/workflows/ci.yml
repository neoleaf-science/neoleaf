name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake
      - run: cargo check --all-targets --locked
      - run: cargo test --locked

  # The local agent runs its tests and a smoke run on the three systems it supports (macOS and Windows used to be only cross-compiled).
  agent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Smoke run
        shell: bash
        run: |
          BIN=target/release/neoleaf-agent
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --version
          "$BIN" help > /dev/null

  # Manual only for now: the E2E suite needs the generated WebAssembly bundles (mise run fonts bibtex biber xelatex lualatex) and was not run on GitHub Actions yet.
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake git
      - run: cd tests/e2e && bun install && bunx playwright install --with-deps chromium
      - run: cd tests/e2e && bun test --timeout 180000
