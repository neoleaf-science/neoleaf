[package]
name = "neoleaf"
version = "1.37.2"
edition = "2024"
authors = ["Tássio Virgínio"]
license = "MIT OR Apache-2.0"

[dependencies]
libc = "0.2"
bytes = "1"
http-body = "1"
http-body-util = "0.1"
sha2 = "0.11"
base64 = "0.23.1"
cookie = "0.18.2"
dotenvy = "0.15.7"
flate2 = "1.1.10"
futures-util = "0.3.34"
lzma-rs = "0.3.0"
rand = "0.10"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["form", "json", "multipart", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["full"] }
topcoat = { version = "0.11.0", features = ["websocket"] }
urlencoding = "2.1.3"
yrs = "0.28.0"
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }
aes-gcm = "0.11.1"
toml = "1"
