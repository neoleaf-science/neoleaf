# NeoLeaf institution file. Copy it to `neoleaf.toml` next to the executable (or point NEOLEAF_CONFIG at it).
#
# Without a `neoleaf.toml` the server behaves as the public NeoLeaf site (landing page, GitHub, Codeberg if configured).
# With it, the home page for people who are not signed in is a plain sign-in screen with your name and logo.
#
# Check it before starting:   ./neoleaf --check-config
# An invalid file stops the server with a message that says what to fix.
#
# Secrets never go in this file: use the environment (or .env) for the client secrets.

[brand]
name = "My University LaTeX"            # shown on the sign-in screen and in the tab title (default: NeoLeaf)
logo = "brand/logo.svg"                 # PNG, JPEG, GIF, WebP or SVG up to 512 KiB, path inside this folder (no ..)
logo_dark = "brand/logo-dark.svg"       # optional: used with the dark themes
accent = "#1a7f37"                      # optional: colour of the sign-in buttons, #rrggbb (default: the NeoLeaf theme)
contact_email = "support@university.edu"

# Your own Terms and Privacy pages. When set, /terms and /privacy go there; when empty, the built-in pages
# (which speak for neoleaf.science, not for your institution) are shown. Set both for a real install.
[legal]
terms_url = "https://university.edu/latex/terms"
privacy_url = "https://university.edu/latex/privacy"

# The AI assistant of the editor (people paste their own key of an AI provider; the questions and the text of the project files the
# assistant reads go from their browser straight to that provider, never through this server). With a neoleaf.toml it is OFF unless you
# switch it on here. The built-in Privacy and Terms pages already describe it; if you set your own pages above, cover it there too.
[ai]
enabled = false

# Which sign-in providers are on. A provider that is not listed, or has enabled = false, is off
# (its sign-in address answers with a redirect to /).
[providers.github]
enabled = true
# admins = [12345678]                   # optional: numeric ids of the administrators who sign in with this provider (open /admin)
# client_id = "..."                     # optional: otherwise GITHUB_CLIENT_ID
# client_secret_env = "MY_GH_SECRET"    # optional: NAME of the variable that holds the secret, otherwise GITHUB_CLIENT_SECRET

[providers.codeberg]
enabled = false

# Your own Git server (Forgejo or Gitea). The id (the name after "providers.") is yours: lowercase letters, digits and hyphen.
# People sign in with the account of that server, and their projects are repositories on it.
# On the server, create an OAuth2 application with the redirect address  <your NeoLeaf address>/auth/callback/<id>
# (for the id below: https://latex.university.edu/auth/callback/git-university).
# [providers.git-university]
# enabled = true
# kind = "forgejo"                          # forgejo or gitea (gitlab is not supported yet)
# url = "https://git.university.edu"        # https only (http only for localhost)
# label = "Sign in with your university account"   # the whole text of the button, shown as written
# admins = [34]                                    # numeric ids of this server's administrators of NeoLeaf (see /api/v1/user of the server)
# internal_url = "http://forgejo:3000"            # optional: where NeoLeaf itself reaches the server, when that differs from the address people use
# client_id = "..."                                # or client_id_env = "GIT_CLIENT_ID" (the NAME of a variable)
# client_secret_env = "GIT_UNIVERSITY_SECRET"      # NAME of the variable that holds the secret (the secret never goes in this file)
